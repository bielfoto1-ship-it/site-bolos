    </div>

    <script>
        // URL de implantação do seu Google Apps Script (aquele final /exec)

        // Exemplo de como você pode buscar os dados do cardápio ao abrir a página:

                // const dados = await resposta.json();

                document.getElementById('app').innerHTML = `
                    <div class="bg-white p-6 rounded-lg shadow-md">
